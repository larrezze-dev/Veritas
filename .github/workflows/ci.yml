# CI de T-001. Repositorio público larrezze-dev/Veritas.
# windows-latest no equivale a Windows 11 (NFR-001 se verifica localmente).
# ubuntu-latest desde T-018 E1 (D-e): el worker y el golden de la CLI también en Linux.
# T-011 E2 (D4): el extra opcional «gui» (PySide6, PyVista) solo se instala en windows; en
# ubuntu sus pruebas se omiten. Con QT_QPA_PLATFORM=offscreen VTK no proyecta píxeles: la prueba
# de clic se omite también en windows y solo se ejecuta en local (plataforma nativa).
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            uv_extras: "--extra gui"
          - os: ubuntu-latest
            uv_extras: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Instalar entorno desde uv.lock
        run: uv sync --locked ${{ matrix.uv_extras }}
      - name: Lint
        run: uv run ${{ matrix.uv_extras }} ruff check .
      - name: Formato
        run: uv run ${{ matrix.uv_extras }} ruff format --check .
      - name: Tipado
        run: uv run ${{ matrix.uv_extras }} mypy
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run ${{ matrix.uv_extras }} pytest
