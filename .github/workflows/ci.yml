# CI de T-001. Repositorio público larrezze-dev/Veritas.
# windows-latest no equivale a Windows 11 (NFR-001 se verifica localmente).
# ubuntu-latest desde T-018 E1 (D-e): el worker y el golden de la CLI también en Linux.
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Instalar entorno desde uv.lock
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipado
        run: uv run mypy
      - name: Tests
        run: uv run pytest
