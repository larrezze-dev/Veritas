[project]
name = "veritas"
version = "0.0.1"
description = "Veritas Structural Calculation 3D: aplicación experimental de estructuras de barras y nudos 3D."
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Luciano Arrezze" }]
# Licencia del producto pendiente (DEC-006): no se declara.
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.scripts]
veritas = "veritas.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT"]
# Símbolos técnicos legítimos en textos en español (producto, densidad).
allowed-confusables = ["×", "ρ"]

[tool.ruff.lint.per-file-ignores]
# En los tests los valores literales son las referencias que se comprueban.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
